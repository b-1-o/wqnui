<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101c">
<meta name="color-scheme" content="dark">
<title>wqnui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070f1c;
  --text:#eaf4ff;
  --ghost:#7a9cb8;
  --cyan:#6ef0ff;
  --soft:#b8e4f5;
  --border:rgba(138,212,239,.2);
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:Outfit,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a,button,input{-webkit-tap-highlight-color:transparent}
button{font:inherit;border:none;background:none;cursor:pointer}

@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes name{0%{opacity:0;letter-spacing:.4em;filter:blur(6px)}100%{opacity:1;letter-spacing:.2em;filter:none}}
@keyframes wave{50%{height:var(--h)}}

/* BG — lightweight */
.bg{
  position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%,#1a3558 0%,transparent 55%),
    linear-gradient(180deg,#070f1c 0%,#0a1628 50%,#060d18 100%);
}
.bg-img{
  position:absolute;inset:0;
  background:url(phon.jpg) center 35%/cover no-repeat;
  opacity:.4;
  filter:brightness(.55) saturate(.65);
  mask-image:linear-gradient(to bottom,#000 0 55%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0 55%,transparent 100%);
}
.bg-eyes{
  position:absolute;inset:0;
  background:url(eyes.jpg) 50% 25%/min(100%,520px) no-repeat;
  opacity:.1;
  mix-blend-mode:screen;
}
.bg-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 85% 75% at 50% 35%,transparent 25%,rgba(7,15,28,.75) 100%);
}

.page{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column;align-items:center}

/* HERO */
.hero{
  position:relative;width:100%;height:min(42vh,380px);min-height:230px;
  overflow:hidden;
}
.hero-rose{
  position:absolute;z-index:1;left:0;top:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 30%;
  filter:saturate(.7) contrast(1.05) brightness(.78) hue-rotate(-8deg);
  mask-image:linear-gradient(to bottom,#000 0 40%,#000a 58%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0 40%,#000a 58%,transparent 100%);
  transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .4s ease;
}
.hero-angy{
  position:absolute;z-index:2;left:50%;top:0;width:min(65%,420px);height:100%;
  transform:translateX(-50%);
  object-fit:contain;object-position:center 15%;
  opacity:0;
  mix-blend-mode:screen;
  transition:opacity .5s ease;
  pointer-events:none;
}
.hero-build{
  position:absolute;z-index:3;left:0;top:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 40%;
  opacity:0;
  mix-blend-mode:soft-light;
  transition:opacity .45s ease;
  mask-image:linear-gradient(to bottom,#000 0 50%,transparent 95%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0 50%,transparent 95%);
}
.hero-overlay{
  position:absolute;z-index:5;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 25%,transparent 20%,rgba(7,15,28,.55) 100%);
  pointer-events:none;
}
.hero-bottom{
  position:absolute;z-index:6;left:0;right:0;bottom:0;height:45%;
  background:linear-gradient(to bottom,transparent,var(--bg));
  pointer-events:none;
}
.hero-name{
  position:absolute;z-index:10;left:50%;bottom:12%;width:94%;
  transform:translateX(-50%);text-align:center;pointer-events:none;
}
.mark{display:block;color:var(--cyan);font:300 22px/1 var(--serif);text-shadow:0 0 18px rgba(110,240,255,.45)}
.hero-name h1{
  color:#f4faff;
  font:300 clamp(38px,9vw,68px)/.9 var(--serif);
  letter-spacing:.2em;
  animation:name 1s cubic-bezier(.16,1,.3,1) both;
  text-shadow:0 3px 24px rgba(0,10,25,.9),0 0 40px rgba(110,240,255,.18);
}
.tagline{
  margin-top:8px;color:rgba(184,228,245,.65);
  font-size:9px;letter-spacing:.36em;text-transform:uppercase;
  animation:fade .7s .25s both;
}

.wrap{
  position:relative;z-index:20;
  width:min(680px,calc(100% - 24px));
  margin-top:-24px;padding-bottom:48px;
}
.quote{
  text-align:center;margin-bottom:16px;
  color:rgba(234,244,255,.68);
  font:italic 300 clamp(15px,3vw,20px)/1.3 var(--serif);
  animation:fade .6s .3s both;
}

/* LINKS */
.links{
  display:grid;gap:8px;margin-bottom:14px;
  max-height:210px;overflow:hidden;
  transition:max-height .35s ease,opacity .25s ease,transform .35s ease,margin .35s ease;
}
.links a{
  display:flex;align-items:center;justify-content:space-between;
  min-height:54px;padding:0 14px 0 15px;
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);text-decoration:none;
  background:rgba(22,42,72,.55);
  box-shadow:0 8px 24px rgba(0,6,20,.4);
  transition:transform .2s,border-color .2s;
  animation:fade .45s both;
}
.links a:nth-child(2){animation-delay:.05s}
.links a:nth-child(3){animation-delay:.1s}
.links a:active{transform:scale(.98)}
.link-main{display:flex;align-items:center;gap:11px}
.link-icon{
  width:32px;height:32px;display:grid;place-items:center;
  border:1px solid rgba(138,212,239,.28);
  border-radius:9px;
  background:rgba(110,240,255,.08);
  color:var(--soft);
}
.link-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.link-copy{display:flex;flex-direction:column;gap:1px}
.link-copy small{color:var(--ghost);font-size:7.5px;letter-spacing:.28em}
.link-copy strong{font-size:13.5px;letter-spacing:.03em;font-weight:500}
.link-arrow{color:rgba(184,228,245,.45);font-size:15px}

/* PLAYER */
.player{
  position:relative;overflow:hidden;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(18,36,62,.65);
  box-shadow:0 14px 40px rgba(0,5,18,.5);
  transition:transform .4s cubic-bezier(.16,1,.3,1),border-radius .3s;
}
.player-top{
  display:grid;grid-template-columns:46px minmax(0,1fr) auto;
  gap:11px;align-items:center;padding:13px 14px 9px;
}
.play{
  width:44px;height:44px;
  border:1px solid rgba(138,212,239,.35);
  border-radius:12px;
  background:rgba(110,240,255,.15);
  color:#eef9ff;
  display:grid;place-items:center;
  cursor:pointer;touch-action:manipulation;
  transition:transform .15s;
}
.play:active{transform:scale(.93)}
.play svg{width:17px;height:17px;fill:currentColor}
.track-title{font:400 17px/1.1 var(--serif);color:#f4faff}
.track-sub{margin-top:3px;color:var(--ghost);font-size:8px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ext{color:rgba(184,228,245,.45);text-decoration:none;font-size:8px;letter-spacing:.1em;text-transform:uppercase}

.wave{height:22px;display:flex;align-items:center;gap:2px;padding:0 14px}
.wave i{
  flex:1;height:12%;border-radius:99px;
  background:linear-gradient(180deg,var(--cyan),rgba(138,212,239,.4));
  opacity:.45;
}
.player.playing .wave i{animation:wave var(--d) ease-in-out infinite alternate;opacity:.9}

.progress{
  display:grid;grid-template-columns:38px minmax(0,1fr) 38px;
  gap:6px;align-items:center;padding:2px 14px 10px;
  color:var(--ghost);font-size:8px;
}
input[type=range]{
  width:100%;height:3px;appearance:none;
  background:rgba(138,212,239,.14);border-radius:99px;outline:0;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--cyan);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:11px;height:11px;border:0;border-radius:50%;background:var(--cyan);
}

.lyrics{
  max-height:0;overflow:hidden;opacity:0;padding:0 14px;
  border-top:1px solid transparent;text-align:center;
  transition:max-height .35s ease,opacity .2s ease,padding .3s ease;
}
.lyric{
  color:#f0f8ff;
  font:300 clamp(18px,3.8vw,28px)/1.2 var(--serif);
  min-height:64px;display:grid;place-items:center;
}
.lyric.active{animation:fade .2s}

/* PLAYING */
body.is-playing .links{
  max-height:0;opacity:0;transform:translateY(-10px);margin:0;pointer-events:none;
}
body.is-playing .hero-rose{transform:scale(.84,.7);opacity:.7}
body.is-playing .hero-angy{opacity:.5}
body.is-playing .hero-build{opacity:.4}

.player.expanded{
  transform:translateY(-64px);
  border-radius:18px;
  box-shadow:0 20px 50px rgba(0,8,25,.6);
}
.player.expanded .lyrics{
  max-height:260px;opacity:1;padding:16px 12px 18px;
  border-color:rgba(138,212,239,.12);
}
.player.expanded .wave{height:28px}
.player.expanded .lyric{font-size:clamp(20px,4vw,32px)}

.footer{
  margin-top:24px;text-align:center;
  color:rgba(122,156,184,.35);
  font-size:9px;letter-spacing:.3em;
  animation:fade .7s .5s both;
}

/* Telegram WebView — lighter */
body.tg-webview .bg-img{opacity:.32;filter:brightness(.5) saturate(.5)}
body.tg-webview .bg-eyes{display:none}
body.tg-webview .hero-angy,
body.tg-webview .hero-build{display:none}
body.tg-webview .player{background:rgba(12,24,42,.78)}
body.tg-webview .links a{background:rgba(18,34,58,.7)}
body.tg-webview .wave i{animation:none!important}
body.tg-webview .player.playing .wave i{opacity:.7}

/* mobile */
@media(max-width:600px){
  .hero{height:clamp(200px,30svh,260px);min-height:200px}
  .hero-name{bottom:10%}
  .hero-name h1{font-size:clamp(32px,10vw,48px);letter-spacing:.14em}
  .mark{font-size:18px}
  .tagline{font-size:7.5px;letter-spacing:.26em}
  .wrap{width:calc(100% - 14px);margin-top:-10px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .quote{margin-bottom:10px;font-size:15px}
  .links{gap:7px;margin-bottom:9px;max-height:175px}
  .links a{min-height:48px;border-radius:12px;padding:0 11px}
  .link-icon{width:28px;height:28px;border-radius:8px}
  .link-copy strong{font-size:12px}
  .link-copy small{font-size:6.5px}
  .player{border-radius:14px}
  .player-top{grid-template-columns:40px minmax(0,1fr) auto;gap:8px;padding:10px 11px 7px}
  .play{width:38px;height:38px;border-radius:10px}
  .track-title{font-size:14.5px}
  .track-sub{font-size:7px}
  .wave{height:16px;padding:0 11px}
  .progress{grid-template-columns:32px minmax(0,1fr) 32px;gap:5px;padding:2px 11px 8px;font-size:7.5px}
  .player.expanded{transform:translateY(-70px);border-radius:16px}
  .player.expanded .lyrics{max-height:280px;padding:14px 6px 16px}
  .player.expanded .wave{height:24px}
  .player.expanded .lyric{font-size:clamp(18px,6vw,26px);min-height:70px}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
(()=>{
  const ua=navigator.userAgent||'';
  const isTG=/Telegram/i.test(ua)||!!window.TelegramWebviewProxy;
  if(isTG) document.body.classList.add('tg-webview');

  const audio=document.getElementById('audio'),
        play=document.getElementById('play'),

        cur=document.getElementById('cur'),

        player=document.getElementById('player'),

  // fewer bars in Telegram / mobile
  const bars = isTG || matchMedia('(max-width:600px)').matches ? 10 : 16;
  for(let i=0;i<bars;i++){
    const b=document.createElement('i');
    b.style.setProperty('--h',20+Math.random()*70+'%');
    b.style.setProperty('--d',1+Math.random()+'s');
    wave.appendChild(b);
  }

  const L=[
    {t:0,s:'…'},
    {t:8.9,s:'I step inside, everybody knows me'},
    {t:10.7,s:"Never thought this is how it's gonna be"},

    {t:114.3,s:'Да я drive boy, dog boy, dirty numb и angel boy'},

    {t:131.5,s:'…'}

  const fmt=t=>{
    if(!isFinite(t))return '0:00';
    const m=Math.floor(t/60),s=Math.floor(t%60);
    return m+':'+(s<10?'0':'')+s;
  };

  let idx=0;
  const syncLyric=()=>{
    const t=audio.currentTime;
    while(idx<L.length-1&&t>=L[idx+1].t)idx++;
    while(idx>0&&t<L[idx].t)idx--;
    const s=L[idx].s;
    if(lyric.textContent!==s){
      lyric.textContent=s;
      lyric.classList.remove('active');
      void lyric.offsetWidth;
      lyric.classList.add('active');

  };

  const setPlaying=on=>{

    playIcon.innerHTML=on

  play.addEventListener('click',()=>{

    else audio.pause();
  });

  audio.addEventListener('play',()=>setPlaying(true));
  audio.addEventListener('pause',()=>setPlaying(false));
  audio.addEventListener('ended',()=>{setPlaying(false);idx=0;lyric.textContent='…';});
  audio.addEventListener('loadedmetadata',()=>{dur.textContent=fmt(audio.duration);});
  audio.addEventListener('timeupdate',()=>{
    if(!seek.dataset.drag){
      seek.value=audio.duration?(audio.currentTime/audio.duration)*100:0;
      cur.textContent=fmt(audio.currentTime);
    }
    syncLyric();
  });

  seek.addEventListener('input',()=>{
    seek.dataset.drag='1';
    cur.textContent=fmt((seek.value/100)*(audio.duration||0));
  });
  seek.addEventListener('change',()=>{
    audio.currentTime=(seek.value/100)*(audio.duration||0);
    delete seek.dataset.drag;
    syncLyric();
  });

  lyric.textContent='…';
})();
</script>
</body>
</html>
