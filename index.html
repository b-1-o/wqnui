<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101c">
<meta name="color-scheme" content="dark">
<title>wqnui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Outfit:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070f1c;
  --text:#eaf4ff;
  --ghost:#7a9cb8;
  --cyan:#6ef0ff;
  --soft:#b8e4f5;
  --border:rgba(138,212,239,.22);
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:Outfit,system-ui,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a,button,input{-webkit-tap-highlight-color:transparent}
button{font:inherit;border:none;background:none;cursor:pointer}

@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes name{
  0%{opacity:0;letter-spacing:.6em;filter:blur(12px);transform:translateY(16px)}
  100%{opacity:1;letter-spacing:.24em;filter:none;transform:none}
}
@keyframes wave{50%{height:var(--h)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 28px rgba(110,240,255,.14),0 0 56px rgba(138,212,239,.07)}
  50%{box-shadow:0 0 42px rgba(110,240,255,.26),0 0 80px rgba(138,212,239,.14)}
}
@keyframes softDrift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-2%,1.5%) scale(1.04)}
  100%{transform:translate(0,0) scale(1)}
}
@keyframes matrixPulse{0%,100%{opacity:.08}50%{opacity:.18}}
@keyframes scan{0%{transform:translateY(-120%)}100%{transform:translateY(220%)}}
@keyframes layerFade{
  0%{opacity:0;transform:scale(1.06)}
  12%{opacity:.9}
  28%{opacity:1}
  72%{opacity:1}
  88%{opacity:.6}
  100%{opacity:0;transform:scale(1)}
}

/* ========== BACKGROUND LAYERS ========== */
.bg{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#070f1c 0%,#0a1628 50%,#060d18 100%);
  pointer-events:none;
}

/* phon.png as atmospheric base */
.bg-phon{
  position:absolute;inset:0;
  background:url(phon.png) center 40%/cover no-repeat;
  filter:saturate(.7) contrast(1.1) brightness(.45) hue-rotate(-8deg);
  opacity:.55;
  mask-image:linear-gradient(to bottom,#000 0 50%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0 50%,transparent 100%);
}

/* eyes.png matrix face – soft overlay */
.bg-eyes{
  position:absolute;inset:0;
  background:url(eyes.png) 50% 30%/min(110%,900px) no-repeat;
  opacity:.14;
  filter:contrast(1.2) brightness(1.1);
  mix-blend-mode:screen;
  animation:matrixPulse 11s ease-in-out infinite;
}

/* soft cyan orbs */
.bg-orbs::before,.bg-orbs::after{
  content:"";position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;
}
.bg-orbs::before{
  width:60vw;height:60vw;max-width:560px;max-height:560px;
  left:50%;top:5%;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(190,235,255,.55) 0%,rgba(100,180,230,.12) 45%,transparent 70%);
  animation:softDrift 20s ease-in-out infinite;
}
.bg-orbs::after{
  width:45vw;height:45vw;max-width:400px;max-height:400px;
  right:-8%;bottom:10%;
  background:radial-gradient(circle,rgba(140,200,245,.3) 0%,transparent 65%);
  animation:softDrift 24s ease-in-out infinite reverse;
}

.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(110,240,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(110,240,255,.028) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 10%,transparent 70%);
  opacity:.7;
}

.bg-scan{position:absolute;inset:0;overflow:hidden;opacity:.035}
.bg-scan::after{
  content:"";position:absolute;left:0;right:0;height:28%;
  background:linear-gradient(to bottom,transparent,rgba(180,230,255,.5),transparent);
  animation:scan 8s linear infinite;
}

.bg-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 80% at 50% 40%,transparent 30%,rgba(7,15,28,.7) 100%);
}

/* ========== PAGE ========== */
.page{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column;align-items:center}

/* HERO with layered art */
.hero{
  position:relative;width:100%;height:min(46vh,420px);min-height:250px;
  isolation:isolate;overflow:hidden;
}

/* rose.png main hero */
.hero-rose{
  position:absolute;z-index:1;left:0;top:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 32%;
  filter:saturate(.7) contrast(1.1) brightness(.78) hue-rotate(-10deg);
  mask-image:linear-gradient(to bottom,#000 0 38%,#000c 56%,#0006 74%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0 38%,#000c 56%,#0006 74%,transparent 100%);
  transition:transform .6s cubic-bezier(.16,1,.3,1),filter .5s ease,opacity .5s ease;
  will-change:transform;
}

/* angy.png – soft glowing figure, fades in/out */
.hero-angy{
  position:absolute;z-index:2;left:50%;top:0;width:min(70%,480px);height:100%;
  transform:translateX(-50%);
  object-fit:contain;object-position:center 20%;
  opacity:0;pointer-events:none;
  filter:brightness(1.15) contrast(.95);
  mix-blend-mode:screen;
  transition:opacity .8s ease,transform .6s cubic-bezier(.16,1,.3,1);
}

/* build.png – line art, appears when playing */
.hero-build{
  position:absolute;z-index:3;left:0;top:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 40%;
  opacity:0;
  filter:contrast(1.05) brightness(.9) saturate(.3);
  mix-blend-mode:soft-light;
  transition:opacity .7s ease,transform .6s cubic-bezier(.16,1,.3,1);
  mask-image:linear-gradient(to bottom,#000 0 45%,transparent 90%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0 45%,transparent 90%);
}

.hero-overlay{
  position:absolute;z-index:5;inset:0;
  background:
    radial-gradient(ellipse 80% 65% at 50% 25%,transparent 15%,rgba(7,15,28,.5) 100%),
    linear-gradient(180deg,rgba(8,20,40,.25) 0%,transparent 35%);
  pointer-events:none;transition:opacity .4s ease;
}
.hero-bottom{
  position:absolute;z-index:6;left:-15%;right:-15%;bottom:-30%;height:70%;
  background:linear-gradient(to bottom,transparent,rgba(7,15,28,.5) 25%,var(--bg) 85%);
  filter:blur(10px);pointer-events:none;
}

.hero-name{
  position:absolute;z-index:10;left:50%;bottom:12%;width:94%;
  transform:translateX(-50%);text-align:center;pointer-events:none;
}
.mark{
  display:block;color:var(--cyan);font:300 24px/1 var(--serif);
  text-shadow:0 0 28px rgba(110,240,255,.6);
  animation:float 4.8s ease-in-out infinite;
}
.hero-name h1{
  color:#f6fbff;
  font:300 clamp(42px,9.5vw,78px)/.88 var(--serif);
  letter-spacing:.24em;
  animation:name 1.2s cubic-bezier(.16,1,.3,1) both;
  text-shadow:0 4px 36px rgba(0,12,30,.95),0 0 60px rgba(110,240,255,.25);
}
.tagline{
  margin-top:11px;color:rgba(184,228,245,.72);
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  font-family:var(--mono);
  animation:fade .85s .3s both;
}

.wrap{
  position:relative;z-index:20;
  width:min(720px,calc(100% - 28px));
  margin-top:-32px;padding-bottom:60px;
}
.quote{
  text-align:center;margin-bottom:22px;
  color:rgba(234,244,255,.72);
  font:italic 300 clamp(16px,3.2vw,23px)/1.35 var(--serif);
  text-shadow:0 2px 22px rgba(0,0,0,.6);
  animation:fade .75s .35s both;
}

/* LINKS */
.links{
  display:grid;gap:11px;margin-bottom:18px;
  max-height:230px;overflow:hidden;
  transition:max-height .45s cubic-bezier(.16,1,.3,1),
             opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1),margin .45s ease;
}
.links a{
  display:flex;align-items:center;justify-content:space-between;
  min-height:60px;padding:0 18px 0 18px;
  border:1px solid var(--border);
  border-radius:16px;
  color:var(--text);text-decoration:none;
  background:linear-gradient(150deg,rgba(26,50,88,.5),rgba(12,26,48,.42));
  box-shadow:0 12px 36px rgba(0,6,24,.55),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .22s,border-color .22s,box-shadow .25s,background .25s;
  animation:fade .55s both;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.links a:nth-child(2){animation-delay:.08s}
.links a:nth-child(3){animation-delay:.16s}
.links a:hover{
  transform:translateY(-3px);
  border-color:rgba(110,240,255,.5);
  background:linear-gradient(150deg,rgba(32,62,105,.58),rgba(16,36,62,.5));
  box-shadow:0 16px 44px rgba(0,12,36,.6),0 0 32px rgba(110,240,255,.15);
}
.links a:active{transform:scale(.98)}

.link-main{display:flex;align-items:center;gap:14px}
.link-icon{
  width:38px;height:38px;display:grid;place-items:center;
  border:1px solid rgba(138,212,239,.32);
  border-radius:12px;
  background:rgba(110,240,255,.1);
  color:var(--soft);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.links a:hover .link-icon{
  border-color:rgba(110,240,255,.6);
  background:rgba(110,240,255,.18);
  box-shadow:0 0 18px rgba(110,240,255,.22);
}
.link-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.link-copy{display:flex;flex-direction:column;gap:2px}
.link-copy small{color:var(--ghost);font-size:8px;letter-spacing:.32em;font-family:var(--mono)}
.link-copy strong{font-size:15px;letter-spacing:.04em;font-weight:500}
.link-arrow{color:rgba(184,228,245,.5);font-size:18px;transition:color .2s,transform .22s}
.links a:hover .link-arrow{color:var(--cyan);transform:translate(3px,-2px)}

/* PLAYER */
.player{
  position:relative;overflow:hidden;
  border:1px solid var(--border);
  border-radius:20px;
  background:linear-gradient(165deg,rgba(20,40,70,.6),rgba(10,22,40,.55));
  box-shadow:0 20px 56px rgba(0,5,20,.6),inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .48s cubic-bezier(.16,1,.3,1),border-radius .35s,box-shadow .35s;
  will-change:transform;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  animation:glowPulse 6.5s ease-in-out infinite;
}
.player-top{
  display:grid;grid-template-columns:52px minmax(0,1fr) auto;
  gap:13px;align-items:center;padding:16px 17px 11px;
}
.play{
  width:50px;height:50px;
  border:1px solid rgba(138,212,239,.4);
  border-radius:15px;
  background:linear-gradient(150deg,rgba(110,240,255,.22),rgba(36,80,125,.3));
  color:#eef9ff;
  display:grid;place-items:center;
  cursor:pointer;touch-action:manipulation;
  transition:transform .18s,box-shadow .22s,border-color .22s,background .22s;
  box-shadow:0 6px 20px rgba(0,22,50,.42),inset 0 1px 0 rgba(255,255,255,.14);
}
.play:hover{
  border-color:rgba(110,240,255,.7);
  background:linear-gradient(150deg,rgba(110,240,255,.32),rgba(45,95,145,.38));
  box-shadow:0 8px 28px rgba(110,240,255,.28),inset 0 1px 0 rgba(255,255,255,.2);
}
.play:active{transform:scale(.92)}
.play svg{width:20px;height:20px;fill:currentColor}
.track-title{font:400 19px/1.1 var(--serif);color:#f6fbff}
.track-sub{margin-top:4px;color:var(--ghost);font-size:9px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.ext{color:rgba(184,228,245,.5);text-decoration:none;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono);transition:color .2s}
.ext:hover{color:var(--cyan)}

.wave{height:28px;display:flex;align-items:center;gap:2.5px;padding:0 17px}
.wave i{
  flex:1;height:12%;border-radius:99px;
  background:linear-gradient(180deg,var(--cyan),rgba(138,212,239,.4));
  opacity:.5;animation:none;
}
.player.playing .wave i{animation:wave var(--d) ease-in-out infinite alternate;opacity:.95}

.progress{
  display:grid;grid-template-columns:44px minmax(0,1fr) 44px;
  gap:8px;align-items:center;padding:4px 17px 12px;
  color:var(--ghost);font-size:9px;font-family:var(--mono);
}
input[type=range]{
  width:100%;height:3px;appearance:none;
  background:rgba(138,212,239,.15);border-radius:99px;outline:0;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:14px;height:14px;border-radius:50%;
  background:linear-gradient(135deg,#f2fbff,var(--cyan));
  box-shadow:0 0 14px rgba(110,240,255,.6);
  cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border:0;border-radius:50%;
  background:linear-gradient(135deg,#f2fbff,var(--cyan));
  box-shadow:0 0 14px rgba(110,240,255,.6);
}

.lyrics{
  max-height:0;overflow:hidden;opacity:0;padding:0 18px;
  border-top:1px solid transparent;text-align:center;
  transition:max-height .45s ease,opacity .28s ease,padding .35s ease,border-color .2s ease;
}
.lyric{
  color:#f2f9ff;
  font:300 clamp(19px,4vw,32px)/1.2 var(--serif);
  min-height:72px;display:grid;place-items:center;
  text-shadow:0 0 32px rgba(110,240,255,.2);
}
.lyric.active{animation:fade .25s}

/* PLAYING STATE */
body.is-playing .links{
  max-height:0;opacity:0;transform:translateY(-14px);margin:0;pointer-events:none;
}
body.is-playing .hero-rose{
  transform:scale(.82,.68);
  filter:saturate(.55) contrast(1.15) brightness(.62) hue-rotate(-14deg);
  opacity:.75;
}
body.is-playing .hero-angy{
  opacity:.55;
  transform:translateX(-50%) scale(.92);
}
body.is-playing .hero-build{
  opacity:.45;
  transform:scale(1.05);
}
body.is-playing .hero-overlay{opacity:.9}

.player.expanded{
  transform:translateY(-78px);
  border-radius:24px;
  box-shadow:0 28px 72px rgba(0,10,30,.7),0 0 56px rgba(110,240,255,.14);
}
.player.expanded .lyrics{
  max-height:300px;opacity:1;padding:20px 16px 24px;
  border-color:rgba(138,212,239,.15);
}
.player.expanded .wave{height:36px}
.player.expanded .lyric{font-size:clamp(22px,4.2vw,36px)}

.footer{
  margin-top:32px;text-align:center;
  color:rgba(122,156,184,.38);
  font-size:10px;letter-spacing:.34em;font-family:var(--mono);
  animation:fade 1s .6s both;
}

/* mobile */
@media(max-width:600px){
  .hero{height:clamp(220px,34svh,290px);min-height:220px}
  .hero-rose{filter:saturate(.68) contrast(1.08) brightness(.76) hue-rotate(-8deg)}
  .hero-angy{width:min(85%,420px)}
  .hero-name{bottom:9%;width:96%}
  .hero-name h1{font-size:clamp(34px,10.8vw,52px);letter-spacing:.14em}
  .mark{font-size:20px}
  .tagline{font-size:8px;letter-spacing:.28em;margin-top:7px}
  .wrap{width:calc(100% - 14px);margin-top:-14px;padding-bottom:max(30px,env(safe-area-inset-bottom))}
  .quote{margin-bottom:13px;font-size:15.5px}
  .links{gap:8px;margin-bottom:11px;max-height:195px}
  .links a{min-height:52px;border-radius:13px;padding:0 13px}
  .link-icon{width:32px;height:32px;border-radius:10px}
  .link-copy strong{font-size:13px}
  .link-copy small{font-size:7px}
  .player{border-radius:16px}
  .player-top{grid-template-columns:44px minmax(0,1fr) auto;gap:9px;padding:12px 13px 8px}
  .play{width:42px;height:42px;border-radius:12px}
  .track-title{font-size:15.5px}
  .track-sub{font-size:7.5px}
  .wave{height:18px;padding:0 13px;gap:2px}
  .progress{grid-template-columns:34px minmax(0,1fr) 34px;gap:6px;padding:3px 13px 9px;font-size:8px}
  .player.expanded{transform:translateY(-82px);border-radius:18px}
  .player.expanded .lyrics{max-height:320px;padding:16px 6px 18px}
  .player.expanded .wave{height:28px}
  .player.expanded .lyric{font-size:clamp(19px,6.5vw,29px);line-height:1.1;min-height:80px}
}

@media(pointer:coarse){.links a:hover{transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition-duration:.01ms!important}
}
body.tg-webview .player{background:rgba(10,20,38,.78)}
</style>
</head>
